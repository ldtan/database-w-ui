<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Database w/ UI</title>
    <script>
      // Apply the saved theme before first paint to avoid a flash of the default.
      (function () {
        try {
          var t = localStorage.getItem("ui-theme") || "modern";
          var m = localStorage.getItem("ui-mode") || "light";
          var r = document.documentElement;
          r.dataset.theme = t;
          r.dataset.mode = m;
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
