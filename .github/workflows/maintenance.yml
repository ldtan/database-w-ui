# Render's Cron Job is a paid service type, so the maintenance jobs run here.
#
# They are idempotent housekeeping and nothing depends on them having run — a missed night just
# means soft-deleted rows outlive their window and reconciliation waits a day. That is what
# makes a free scheduler an honest home for them.
#
# The order is not arbitrary: converge the record shapes first, then purge what is past its
# window, then sweep the grants those purges orphaned — and rebuild the calculated-column
# index last of all, because it derives from whatever the steps above leave behind.
name: Daily maintenance

on:
  schedule:
    # 03:17 UTC. Off the hour on purpose — every scheduler on the planet fires at :00.
    - cron: "17 3 * * *"
  workflow_dispatch:

# Two runs of housekeeping over the same database is not dangerous — every job here
# is idempotent — but it is confusing to read in the log, and a manual run kicked off
# while the nightly one is going would interleave with it.
concurrency:
  group: maintenance
  cancel-in-progress: false

jobs:
  maintain:
    runs-on: ubuntu-latest
    # Nothing here should take half an hour. Without a ceiling a job that hangs on a
    # database connection burns the full six-hour default and the failure looks like
    # a run that is still going.
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    env:
      # This runs outside Render, so it needs the database's **external** connection string —
      # the internal one the API uses is not routable from here. Which means SSL, which means
      # `?ssl=require`: asyncpg is not libpq and does not know the word `sslmode`.
      #   postgresql+asyncpg://…render.com/dbui?ssl=require
      DATABASE_URI: ${{ secrets.DATABASE_URI }}
      # Settings requires these four, so they must be *set* — but none of these jobs imports
      # src/auth/helpers.py, which is the only module that reads the key files, so the paths
      # need not point at anything. (Verified by importing each job with bogus paths.) Nothing
      # here signs a token; nothing here needs a real secret.
      SECRET_KEY: unused-by-the-maintenance-jobs
      AUTH_SALT: unused-by-the-maintenance-jobs
      RSA_PRIVATE_KEY_PATH: /dev/null
      RSA_PUBLIC_KEY_PATH: /dev/null
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.14"

      - run: uv sync --frozen --no-dev

      # `continue-on-error` on every job below, and it is not laziness. These are
      # eight independent pieces of housekeeping run in a sensible order, not eight
      # steps of one procedure — under the default fail-fast, a transient failure in
      # the *first* one silently skipped all five purges and the grant sweep, so one
      # bad night became a night with no maintenance at all. Each one now runs and
      # reports for itself, and the guard step at the end fails the run if any did.
      - name: Converge record shapes
        id: reconcile
        continue-on-error: true
        run: uv run python -m src.maintenance.reconcile_shapes

      - name: Purge deleted workspaces
        id: purge_workspaces
        continue-on-error: true
        run: uv run python -m src.maintenance.purge_deleted_workspaces

      - name: Purge deleted tables
        id: purge_tables
        continue-on-error: true
        run: uv run python -m src.maintenance.purge_deleted_tables

      - name: Purge deleted records
        id: purge_records
        continue-on-error: true
        run: uv run python -m src.maintenance.purge_deleted_records

      # After the table purge, which owns the children of a deleted table; this one
      # only takes views/forms/metrics binned on their own under a live table.
      - name: Purge deleted views, forms and metrics
        id: purge_config
        continue-on-error: true
        run: uv run python -m src.maintenance.purge_deleted_table_config

      - name: Purge deleted users and groups
        id: purge_principals
        continue-on-error: true
        run: uv run python -m src.maintenance.purge_deleted_principals

      - name: Sweep orphaned grants
        id: sweep_grants
        continue-on-error: true
        run: uv run python -m src.maintenance.sweep_orphan_grants

      # Last, because it derives from everything above: a converged shape or a purged
      # column both change what a formula answers. This is only a backstop — the app
      # re-indexes on demand when a formula changes, and reads recompute regardless, so
      # a missed night costs a stale sort order, never a wrong value.
      - name: Rebuild the calculated-column index
        id: recompute
        continue-on-error: true
        run: uv run python -m src.maintenance.recompute_calculated

      # `continue-on-error` makes every step above report success to the *run*, so
      # without this a night where all eight failed is a green tick. The whole point
      # of an unattended job is that nobody is watching it, which means the only
      # signal anyone gets is this one being red.
      - name: Fail if any job failed
        if: >-
          steps.reconcile.outcome == 'failure' ||
          steps.purge_workspaces.outcome == 'failure' ||
          steps.purge_tables.outcome == 'failure' ||
          steps.purge_records.outcome == 'failure' ||
          steps.purge_config.outcome == 'failure' ||
          steps.purge_principals.outcome == 'failure' ||
          steps.sweep_grants.outcome == 'failure' ||
          steps.recompute.outcome == 'failure'
        run: |
          echo "::error::One or more maintenance jobs failed - see the steps above."
          exit 1
