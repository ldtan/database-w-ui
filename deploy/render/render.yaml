# Render blueprint: this file *is* the deployment. New → Blueprint in the dashboard reads it
# and creates every service below. It does not have to live at the repo root — give Render
# `deploy/render/render.yaml` as the Blueprint path. `rootDir` below stays relative to the
# **repo** root either way, not to this file.
#
# The runbook for a first deploy, and the traps, are in README.md next to this file.
#
# The shape:
#   - the API as a plain Python web service (no container: Render's native runtime installs
#     any released Python, and this app needs 3.14 — every entity's public id comes from
#     uuid.uuid7 in src/core/mixins.py), on `starter` — $7/mo, always-on, and the plan that
#     makes the pre-deploy migration hook available
#   - the SPA as a static site, free and on a CDN, rewriting /api/* to the API so the two
#     share an origin
#   - a Postgres on the smallest paid instance ($6/mo + storage), which is what buys the
#     database a life longer than 30 days and gives it backups
#
# So: ~$13/mo plus storage and any bandwidth over the included 100 GB. Only the static site is
# still free, and static sites have no paid tier to move to — so every "PAID:" note in this
# file now reads "PAID, and taken", and there is no cheap upgrade left un-bought. What remains
# is scaling (more instances, or a bigger plan for the 512 MB both free and starter share),
# and the one thing that would break if this were scaled today is the login throttle, called
# out where it is configured below. See "Deployment" in the root README.

databases:
  # This was a free database, which Render deletes — not empties, deletes — roughly 30 days
  # after it is created, taking the app down with it: DATABASE_URI names a host that no longer
  # exists, so every request errors and the next deploy dies at the pre-deploy migration.
  # DOWN, not blank. The paid plan below ends that clock. The note stays because the recovery
  # is still the recovery for any lost database: create one, paste its internal URL into
  # DATABASE_URI, redeploy — the pre-deploy migration builds it from empty and
  # seed_initial_data recreates the superuser, so the app comes back blank and working.
  #
  # PAID, and taken: `basic-256mb` is $6/mo for the instance plus storage (~$0.30/GB-month,
  # billed on what is provisioned), so the bill is a little over $6 rather than exactly it.
  # It removes the expiry above and turns on managed daily backups. This was the first thing
  # to buy — before the web service — because losing the data is worse than being slow.
  - name: dbui-db
    databaseName: dbui
    user: dbui
    plan: basic-256mb
    region: oregon

services:
  - type: web
    name: dbui-api
    runtime: python
    # PAID, and taken: `starter` is $7/mo for 0.5 CPU and 512 MB. Two things it buys, in order
    # of how much they matter here:
    #   - always-on. The free plan spun the instance down after 15 idle minutes and took 30–60 s
    #     to answer the next request, which is the whole first impression of the app.
    #   - a pre-deploy hook, which is what lets the migration move off startCommand below.
    # It does NOT buy more memory — free and starter are both 512 MB — so nothing in
    # docs/capacity-and-performance.md about memory changes. CPU goes 0.1 → 0.5: 5× on the
    # app-CPU half (search, non-compiled metrics, argon2, RS256) and nothing on the
    # Postgres-side sorting and counting, which was never the bottleneck.
    plan: starter
    region: oregon
    rootDir: backend
    # Liveness only: it answers from the process, never the database, so a database blip
    # cannot get the instance restarted out from under itself.
    healthCheckPath: /health
    buildCommand: pip install uv && uv sync --frozen --no-dev
    # Alembic owns the schema and the app refuses to boot against a database that is behind it
    # (src/infrastructure/schema_check.py), so the upgrade has to land before uvicorn does.
    #
    # This used to be `alembic upgrade head && uvicorn ...` in startCommand, which was only safe
    # because the free plan runs exactly one instance — at boot, every instance races every
    # other instance to run the migration. Here it is instead, which is where it belongs and is
    # a paid-plan feature (Render does not offer the hook on free instance types).
    #
    # It runs after the build and before anything is deployed, on a separate instance, and a
    # failure fails the *deploy*: the currently running version carries on serving, untouched.
    # A bad migration is therefore a red deploy and zero downtime, where before it was a new
    # instance that could not boot. Note the separate instance also means filesystem changes
    # here do not reach the service — this may only touch the database.
    #
    # Set to 1 explicitly rather than left to the default, because **three things in
    # the app are per-process and silently wrong at two instances**, none of which
    # raises, logs, or degrades visibly:
    #
    #   - `lists/events/broker.py` — the SSE fan-out is a module-level dict, so a
    #     write handled by instance A never wakes a subscriber held by instance B.
    #     Half the open lists simply stop updating, and look idle rather than broken.
    #     The documented swap is Postgres LISTEN/NOTIFY behind the same two methods.
    #   - `auth/tokens/throttle.py` — the login throttle's counters, so N instances
    #     allow N times the attempts before locking out.
    #   - `geocode/services.py` — the one-request-per-second gate and the result
    #     cache, so N instances are N callers to Nominatim's published limit and each
    #     one has a colder cache.
    #
    # Leaving it unset made "one instance" a default nobody had chosen; writing it
    # down makes scaling an edit that lands next to the list of what to fix first.
    numInstances: 1
    preDeployCommand: uv run alembic upgrade head
    startCommand: uv run uvicorn main:create_app --factory --host 0.0.0.0 --port $PORT
    envVars:
      - fromGroup: dbui

  - type: web
    name: dbui-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: NODE_VERSION
        value: "22"
      # "Live records" **fallback** polling interval in seconds.
      #
      # An open list normally holds an SSE stream (GET /lists/{uuid}/events) and
      # refetches when the server says its records moved, so this interval is not
      # used at all on a healthy deployment. It is what the app falls back to when
      # the stream cannot be held open — a proxy that buffers text/event-stream,
      # SSE_ENABLED=False below, or a network that forbids them — and the numbers
      # underneath it still describe exactly that case.
      #
      # Baked in at build time (Vite), so a change needs a redeploy. Optional — the
      # app defaults to 10s if unset. `0` disables the fallback entirely, which
      # means a deployment whose stream is blocked would not refresh at all; leave
      # it set. Lower is snappier but more requests. It used to have a second job on
      # the free plan — a focused open tab kept the instance from spinning down —
      # which `starter` makes moot. It was 60 from day one, came down to 15 on
      # 2026-08-18, and became a fallback when push shipped.
      # See docs/planned-features.md #8.
      #
      # Two things on the page do not follow this down, each taking the greater of
      # this and its own floor: the metric strip (VITE_METRIC_REFRESH_SECONDS,
      # default 60) and the paginator's total (VITE_COUNT_REFRESH_SECONDS, default
      # 30). Both are dearer questions than a page of rows, which is one indexed
      # query stopped by LIMIT — a metric scans every record the caller can see, and
      # the count has no limit to stop it either (12 ms unfiltered but 268 ms under
      # a search, on a 100k list). Lowering the value below therefore speeds up the
      # records alone, which is the intent.
      #
      # Those two floors are not fallback-only: under push they throttle how often
      # an event may invalidate the count and the metric strip, so the same cost
      # ceiling holds on both transports. At the 15 set here both are doing real
      # work on the fallback path, which is the whole
      # reason they exist: the records page follows to 15s, the count stops at 30
      # and the metric strip does not move off 60 at all. So this is a 4x on the
      # cheapest of the three queries, 2x on the middle one, and 1x on the dearest
      # — not the 4x across the board it looks like. Per actively-used tab that is
      # ~1.5 ms of CPU per second instead of ~0.6; a hundred such tabs is ~19% of
      # the 0.5-CPU instance, against ~8% at 60. Both guardrails still apply
      # (hidden tab, and 5 min idle on a visible one), so an abandoned tab costs
      # nothing at any interval — this is a bill for tabs someone is using.
      #
      # The ceiling is set by the worst tab open, not the average one: a search on
      # a large list costs ~500 ms a page rather than ~23, so one such viewer is
      # ~33 ms/sec on its own. If that shape ever becomes routine, raise this back
      # up or set VITE_COUNT_REFRESH_SECONDS explicitly rather than absorbing it.
      - key: VITE_LIVE_REFRESH_SECONDS
        value: "15"
      # How many live records a list may hold before the app suggests archiving,
      # or `0` to never suggest it. Optional — the app defaults to 25000, which was
      # measured as where search and non-compiled metrics start to be felt on 0.1
      # CPU. At 0.5 CPU it is conservative by roughly 5×, but it is left alone
      # deliberately: raising it is a claim about wall time nobody has measured on
      # this plan, and the Postgres-side costs in the same table did not move at all.
      # It is a suggestion about the reads that scale with the row count, not a
      # general "your list is big" warning; the paged listing is flat at any size.
      # See docs/capacity-and-performance.md § "When to archive".
      - key: VITE_ARCHIVE_HINT_THRESHOLD
        value: "25000"
    routes:
      # src/lib/api.ts builds every call as a relative `/api/...` — there is no configurable
      # base URL — so the SPA and the API must share an origin. This rewrite is what makes
      # that true, and it is why CORS never enters the picture.
      #
      # Check this hostname after the first deploy: Render appends a suffix when the name it
      # wants is taken, and a wrong host here 404s every request in the app.
      - type: rewrite
        source: /api/*
        destination: https://dbui-api.onrender.com/api/*
      # React Router owns the paths. An unknown one is the SPA, not a 404.
      - type: rewrite
        source: /*
        destination: /index.html

envVarGroups:
  - name: dbui
    envVars:
      # Set by hand, from dbui-db's **internal** connection string, with the scheme rewritten:
      #   postgresql://  ->  postgresql+asyncpg://
      #
      # It cannot be wired with `fromDatabase`: Render emits a plain `postgresql://` URL and
      # SQLAlchemy reads the driver out of that scheme, so the app would reach for psycopg2 —
      # which is neither installed nor async (ModuleNotFoundError). One string edit is the fix.
      #
      # No ssl parameter on the internal network. If you ever use the *external* URL (the
      # maintenance workflow does), note that asyncpg is not libpq: the parameter is
      # `ssl=require`, and `sslmode=require` raises an unexpected-keyword TypeError from a URL
      # that looks perfectly correct.
      - key: DATABASE_URI
        sync: false

      # Generated once, then permanent. AUTH_SALT is mixed into every password hash: change it
      # later and every account is locked out.
      - key: SECRET_KEY
        generateValue: true
      - key: AUTH_SALT
        generateValue: true

      # Upload the existing pair from backend/keys/ as Secret Files on dbui-api; they land at
      # these paths. Do NOT generate a fresh pair per deploy — RS256 signs every token with
      # them, so a new key silently logs out everyone holding one.
      - key: RSA_PRIVATE_KEY_PATH
        value: /etc/secrets/private.pem
      - key: RSA_PUBLIC_KEY_PATH
        value: /etc/secrets/public.pem
      - key: JWT_ALGORITHM
        value: RS256

      # backend/.python-version says 3.14 as well. This is belt and braces: the env var takes
      # precedence and must be fully qualified, and it removes any doubt about which directory
      # Render reads the file from.
      - key: PYTHON_VERSION
        value: 3.14.3

      - key: DEBUG
        value: "False"

      # Declared, not merely absent. DISABLE_AUTH resolves every request to the first row
      # of the users table — the superuser — with no token at all, so setting it here would
      # publish the whole app to anyone holding the URL. The app now refuses to start when
      # it is true and DEBUG is not (src/core/config.py), which turns that mistake into a
      # failed deploy instead of a silent one. Naming it here as well means someone has to
      # edit a line that says False, rather than add a variable that looks harmless.
      - key: DISABLE_AUTH
        value: "False"

      # Empty on purpose: the rewrite above makes the SPA same-origin, so there is no
      # cross-origin request to allow. It is only needed for the VITE_API_BASE fallback
      # described in the README.
      #
      # Note this is not an access control. CORS governs what other *browser pages* may
      # read from the API; it is ignored by curl and by every script. What protects the
      # API is the bearer token on every route, and — on login, the one route that has to
      # answer before a caller has proved anything — the failure limits below.
      - key: ALLOWED_ORIGINS
        value: ""

      # Failed sign-ins per username, and per source address, inside a rolling window,
      # before login answers 429. Defaults (10 / 50 / 15 minutes) apply if unset; they are
      # named here because the seeded username is `admin` below and is not a secret.
      #
      # The counters are per process (src/auth/tokens/throttle.py). That is exact while this
      # runs a single instance (numInstances is unset), and becomes N times looser the moment
      # it is scaled. It is now the ONLY thing that breaks on scaling — the alembic upgrade
      # used to share this caveat and no longer does, having moved to preDeployCommand.
      #
      # If the per-address limit ever locks out real users, the cause is a proxy hop that
      # does not forward the original client address, making everyone share one bucket: set
      # LOGIN_MAX_FAILURES_PER_IP to 0 and the per-username limit carries on alone.
      - key: LOGIN_MAX_FAILURES_PER_USERNAME
        value: "10"
      - key: LOGIN_MAX_FAILURES_PER_IP
        value: "50"
      - key: LOGIN_THROTTLE_WINDOW_MINUTES
        value: "15"

      # "Live records" server push. An open list holds GET /lists/{uuid}/events and
      # refetches when told its records moved; the SPA falls back to polling on its
      # own if the stream will not stay open, so none of these three is required and
      # the defaults (True / 300 / 15) are the intended settings.
      #
      # SSE_ENABLED=False is the kill switch: the route answers 503 and every client
      # reverts to VITE_LIVE_REFRESH_SECONDS above. It lives here rather than in the
      # static site's build config precisely so it can be flipped without rebuilding
      # and redeploying the SPA — which is what you want at the moment you discover
      # you need it.
      #
      # **Reach for it if event frames only arrive when a connection closes.** The
      # SPA reaches the API through the /api/* rewrite on dbui-web, and whether that
      # proxy buffers text/event-stream is not documented. The response already sets
      # Cache-Control: no-transform and X-Accel-Buffering: no. If it is buffering
      # anyway, the alternative to switching this off is to have the SPA call the
      # API's own origin for this one route, which means setting ALLOWED_ORIGINS.
      # Check with:
      #   curl -N -H "Authorization: Bearer <token>" \
      #        https://<web-host>/api/lists/<uuid>/events
      # A ": ping" should appear at once, and more of them every 15 seconds.
      - key: SSE_ENABLED
        value: "True"
      # How long one stream lives before the server closes it and the client
      # reconnects. Finite on purpose, and it is doing four jobs — see the comment on
      # the setting in src/core/config.py. The one to weigh before changing it: this
      # is the **revocation window**, since a stream is authorized at connect and
      # never again. Lower closes that window and costs one request per stream per
      # interval; higher is cheaper and widens it by exactly as much.
      - key: SSE_MAX_STREAM_SECONDS
        value: "300"
      # How often an idle stream emits a comment frame, so a proxy does not reap a
      # connection that has said nothing and the server learns when a peer has gone.
      # Raise it only if something upstream is known to tolerate longer silences.
      - key: SSE_HEARTBEAT_SECONDS
        value: "15"

      # The bootstrap account, seeded on first boot while the users table is empty. On a public
      # URL, `changeme` is a public login: set a real password.
      - key: FIRST_SUPERUSER_USERNAME
        value: admin
      - key: FIRST_SUPERUSER_EMAIL
        sync: false
      - key: FIRST_SUPERUSER_PASSWORD
        sync: false
