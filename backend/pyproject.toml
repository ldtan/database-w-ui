[project]
name = "database-w-ui"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]>=0.128.8",
    "sqlalchemy[asyncio]>=2.0.49",
    "asyncpg>=0.30.0",
    "python-jose[cryptography]>=3.0.0",
    "argon2-cffi>=25.1.0",
    "alembic>=1.18.5",
    "nh3>=0.3.6",
    # `zoneinfo` reads the *operating system's* tz database, which Windows does not
    # have — so a per-user timezone (users.settings.timezone) resolves nothing on a
    # Windows dev box without this. Unconditional rather than marked for win32:
    # available_timezones() returning empty makes every zone look unknown, which
    # rejects the writes and silently sends `today` defaults back to UTC. 350KB to
    # not have that depend on the base image.
    "tzdata>=2025.2",
    # A `phone` column stores E.164, and normalising to it is the whole point of the
    # type — without one canonical form, `unique` misses the same number typed two
    # ways and a filter for it finds only one of them. Doing that by regex means
    # either rejecting real numbers or accepting impossible ones, so this carries
    # Google's libphonenumber metadata instead. Its counterpart on the frontend is
    # `libphonenumber-js`, which *formats* what this normalises; the two version
    # independently but describe the same numbering plans, so update them together.
    "phonenumbers>=9.0.37",
    # Promoted out of the dev group: the geocode proxy (src/geocode) makes an
    # outbound call from a request handler, so it is needed at runtime now, not
    # only by the test client. `fastapi[standard]` happens to pull it in today,
    # which is exactly the kind of transitive dependency that disappears in a minor
    # release and takes a route with it.
    "httpx>=0.28.1",
    # Declared for the same reason httpx above is, and it is a sharper case: every
    # schema in the app imports `pydantic` directly and `core/config.py` imports
    # `pydantic_settings`, but both arrived only through `fastapi[standard]`. The
    # settings object is read at import time by `main.py`, so the day that extra
    # stops pulling `pydantic-settings` the app does not degrade, it fails to start.
    "pydantic>=2.13",
    "pydantic-settings>=2.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    # Run by hand until now (there is a .ruff_cache to prove it), which means it
    # was nobody's job. In the dev group it is installed by `uv sync` and can be a
    # CI step.
    "ruff>=0.16.0",
    # No coverage number existed, which means nobody could notice one falling. Not
    # wired into the CI gate: a floor picked before anyone has seen the number is a
    # guess, and a failing build over a guess teaches people to raise the guess.
    # Measure first (`uv run pytest --cov=src --cov-report=term-missing`), then
    # decide whether a `--cov-fail-under` is worth having.
    "pytest-cov>=6.0.0",
]

[tool.ruff]
line-length = 90
target-version = "py314"

[tool.ruff.lint]
# Deliberately narrow, and chosen by running the wider set first: `E,F,I,UP,B`
# reports 1,034 findings on this tree, of which seven are defects. A gate that
# starts 1,027 findings in the red is not a gate — nobody can land a change through
# it, so it gets `--exit-zero`'d and stops being read. This is the subset that is
# green today and stays meaningful:
#
# - **F (pyflakes)** is the one that is always a defect: an unused import, an
#   undefined name, a variable assigned and never read. All seven real findings were
#   here.
# - **E (pycodestyle errors)** for `E712`/`E741` — a `== False` and an `l` — minus
#   E501 below.
#
# What was left out, and why, so the next person does not have to re-derive it:
#
# - **B008** (278) is `Depends(...)` in a default argument, which is how FastAPI
#   works. It would have to be per-file-ignored across every router to say nothing.
# - **UP** (660) is style modernisation — `Optional[x]` for `x | None`, `timezone.utc`
#   for `UTC`. Real enough as a preference, but it is a whole-tree rewrite that would
#   bury an actual change in a review, and it fixes no bug.
# - **I001** (71) would reorder import blocks this codebase groups by hand, with
#   comments explaining which imports are deferred to avoid a cycle. Those comments
#   are load-bearing (see `permissions.services`) and isort does not read them.
#
# Widening is a separate change with its own diff, not a thing to do while fixing
# something else.
select = ["E", "F"]
# Left to judgement. Several comment blocks here are deliberately prose and
# rewrapping them to 90 columns would cost more than it buys.
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
