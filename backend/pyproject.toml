[project]
name = "database-w-ui"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]>=0.128.8",
    "sqlalchemy[asyncio]>=2.0.49",
    "asyncpg>=0.30.0",
    "python-jose[cryptography]>=3.0.0",
    "argon2-cffi>=25.1.0",
    "alembic>=1.18.5",
    "nh3>=0.3.6",
    # `zoneinfo` reads the *operating system's* tz database, which Windows does not
    # have — so a per-user timezone (users.settings.timezone) resolves nothing on a
    # Windows dev box without this. Unconditional rather than marked for win32:
    # available_timezones() returning empty makes every zone look unknown, which
    # rejects the writes and silently sends `today` defaults back to UTC. 350KB to
    # not have that depend on the base image.
    "tzdata>=2025.2",
    # A `phone` column stores E.164, and normalising to it is the whole point of the
    # type — without one canonical form, `unique` misses the same number typed two
    # ways and a filter for it finds only one of them. Doing that by regex means
    # either rejecting real numbers or accepting impossible ones, so this carries
    # Google's libphonenumber metadata instead. Its counterpart on the frontend is
    # `libphonenumber-js`, which *formats* what this normalises; the two version
    # independently but describe the same numbering plans, so update them together.
    "phonenumbers>=9.0.37",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
